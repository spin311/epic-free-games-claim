<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="store.css">
<script src="layout.js"></script>
<title>Set it once, then forget it</title>
</head>
<body>
<div class="shot">
    <div class="caption">
        <h1>Set it once, then forget it</h1>
        <p>It checks for new giveaways once a day at the hour you pick, or as often as every hour.</p>
    </div>
    <div class="browser" data-tab="Free Games" data-url="store.epicgames.com/en-US/free-games"></div>
    <img class="popup" data-ui="popup-settings.png" alt="">
    <svg class="leaders" aria-hidden="true"></svg>
    <div class="callout" data-target="switch">Pause it any time</div>
    <div class="callout" data-target="schedule">Pick when it checks</div>
    <div class="callout" data-target="rating">Skip badly rated Steam games</div>
    <div class="callout" data-target="login">Tells you when to log in</div>
</div>
</body>
</html>
