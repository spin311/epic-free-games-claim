<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="store.css">
<script src="layout.js"></script>
<title>No code gets lost</title>
</head>
<body>
<div class="shot">
    <div class="caption">
        <h1>No code gets lost</h1>
        <p>If a store asks for a captcha or a sign-in, the code waits in the popup until you redeem it.</p>
    </div>
    <div class="browser" data-tab="Redeem a code" data-url="www.gog.com/redeem"></div>
    <img class="popup" data-ui="popup-pending.png" alt="">
    <svg class="leaders" aria-hidden="true"></svg>
    <div class="callout" data-target="actions">Copy it or try again</div>
</div>
</body>
</html>
