<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="store.css">
<script src="layout.js"></script>
<title>Know what's free now and next</title>
</head>
<body>
<div class="shot">
    <div class="caption">
        <h1>Know what's free now and next</h1>
        <p>When each giveaway ends, next week's free game, and the ones already in your library.</p>
    </div>
    <div class="browser" data-tab="Free Games" data-url="store.epicgames.com/en-US/free-games"></div>
    <img class="popup" data-ui="popup-library.png" alt="">
    <svg class="leaders" aria-hidden="true"></svg>
    <div class="callout" data-target="until">When the giveaway ends</div>
    <div class="callout" data-target="library">Already in your library</div>
    <div class="callout" data-target="upcoming">Next week's free game</div>
</div>
</body>
</html>
